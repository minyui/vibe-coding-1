<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>벽돌깨기 교실</title><style>
*{box-sizing:border-box}body{margin:0;background:#101526;color:#f6f8ff;font-family:'Malgun Gothic',sans-serif}main{max-width:1180px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:clamp(28px,4vw,42px);margin:0}header p{color:#b6c4db;font-size:20px;margin:8px 0 20px}.tag{border:1px solid #47607b;border-radius:30px;padding:10px 18px;color:#89ebd5;font-weight:bold;font-size:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:12px 0 18px}.stat{background:#202a40;border:1px solid #35435c;border-radius:16px;padding:14px 20px}.label{font-size:18px;color:#bdc9df}.value{font-size:32px;font-weight:bold;margin-top:4px}.value small{font-size:18px;color:#b6c4db}.arena{position:relative;border:2px solid #415674;border-radius:18px;overflow:hidden;background:#0c1220}canvas{display:block;width:100%;touch-action:none;cursor:none}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;background:#080d187a}.overlay[hidden]{display:none}.card{text-align:center;background:#172238f2;border:1px solid #526787;border-radius:24px;padding:26px 34px;max-width:90%;box-shadow:0 16px 60px #0007}.card h2{font-size:clamp(24px,4vw,40px);margin:0 0 12px}.card p{font-size:clamp(18px,2.5vw,24px);line-height:1.6;margin:0;color:#d2def0}.controls{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}button{font:700 22px 'Malgun Gothic',sans-serif;border:1px solid #4a5b76;border-radius:12px;padding:14px 22px;color:#fff;background:#26354f;cursor:pointer}button.primary{background:#87efd3;color:#0c2d28;border-color:#87efd3}button:hover:not(:disabled){filter:brightness(1.13)}button:disabled{opacity:.35;cursor:default}button:focus-visible{outline:3px solid #ffd46d;outline-offset:4px}.help{display:flex;gap:12px 30px;flex-wrap:wrap;font-size:20px;color:#d1dbee;line-height:1.7}.help b{color:#fff}footer{font-size:17px;color:#9fadc5;margin-top:12px}#notice{margin-left:auto;align-self:center;font-size:20px;color:#88ebd4}@media(max-width:600px){main{padding:12px}.tag{display:none}.stats{gap:6px}.stat{padding:10px 8px}.value{font-size:23px}.label{font-size:15px}button{font-size:18px;padding:12px 14px}.help{font-size:17px}#notice{width:100%;margin:0}header p{font-size:17px}}
</style></head><body><main><header><div><h1>벽돌깨기 교실<span style="color:#87efd3">.</span></h1><p>공을 튕기고, 벽돌을 깨고, 세 단계에 도전하세요!</p></div><div class="tag">세 단계 도전</div></header><section class="stats" aria-label="게임 현황"><div class="stat"><div class="label">점수</div><div class="value" id="score">0</div></div><div class="stat"><div class="label">남은 생명</div><div class="value"><span id="life">♥ 3</span> <small>/ 5</small></div></div><div class="stat"><div class="label">현재 단계</div><div class="value"><span id="level">1</span> <small>/ 3</small></div></div><div class="stat"><div class="label">공 속도</div><div class="value" id="speed">보통</div></div></section><div class="arena"><canvas width="1000" height="520" id="game" aria-label="벽돌깨기 게임 화면"></canvas><div class="overlay" id="overlay"><div class="card"><h2 id="title">세 단계, 준비됐나요?</h2><p id="message">시작 버튼을 누르고<br>스페이스로 공을 발사하세요.</p></div></div></div><div class="controls"><button class="primary" id="start">시작</button><button id="action" disabled>공 발사</button><button id="next" disabled>다음 단계</button><button id="restart">다시 하기</button><span id="notice" role="status" aria-live="polite">벽돌 하나에 10점!</span></div><div class="help"><span><b>← →</b> 자 이동</span><span><b>마우스·터치</b> 자 이동</span><span><b>스페이스</b> 발사·일시정지</span></div><footer>공을 놓치면 생명 −1 · 남은 벽돌은 유지 · 단계가 올라갈수록 공이 빨라져요.</footer></main><script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),W=1000,H=520;
let score=0,life=3,level=1,state='intro',bricks=[],particles=[],keys={left:false,right:false},paddle={x:420,y:476,w:160,h:16},ball={x:500,y:463,r:9,vx:0,vy:0},last=0;
const colors=['#88eed4','#7fb5ff','#bd9aff','#ffcb73','#ff8f9f'],speeds=[330,405,480];
function hud(){ $('score').textContent=score;$('life').textContent='♥ '+life;$('level').textContent=level;$('speed').textContent=['보통','빠름','아주 빠름'][level-1];$('start').disabled=state!=='intro';$('next').disabled=state!=='clear';$('action').disabled=!['ready','playing','paused'].includes(state);$('action').textContent=state==='playing'?'일시정지':state==='paused'?'계속하기':'공 발사';}
function screen(title,message){$('overlay').hidden=!title;if(title){$('title').textContent=title;$('message').innerHTML=message;}hud();}
function dock(){paddle.x=(W-paddle.w)/2;ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-2;ball.vx=0;ball.vy=0;}
function makeBricks(){bricks=[];let rows=level+2;for(let r=0;r<rows;r++)for(let c=0;c<10;c++)bricks.push({x:35+c*94,y:48+r*36,w:84,h:24,color:colors[r],alive:true});}
function ready(){state='ready';dock();screen('공을 발사하세요','스페이스 또는 공 발사 버튼을 누르세요.');}
function reset(intro=false){score=0;life=3;level=1;particles=[];keys={left:false,right:false};makeBricks();ready();$('notice').textContent='벽돌 하나에 10점!';if(intro){state='intro';screen('세 단계, 준비됐나요?','시작 버튼을 누르고<br>스페이스로 공을 발사하세요.');}}
function action(){if(state==='ready'){let s=speeds[level-1];ball.vx=s*.38;ball.vy=-Math.sqrt(s*s-ball.vx*ball.vx);state='playing';screen();}else if(state==='playing'){state='paused';screen('잠깐 쉬어 가요','스페이스 또는 계속하기 버튼으로 다시 시작!');}else if(state==='paused'){state='playing';screen();}}
function move(x){paddle.x=Math.max(0,Math.min(W-paddle.w,x-paddle.w/2));if(state==='ready'||state==='intro'){ball.x=paddle.x+paddle.w/2;}}
$('start').onclick=()=>ready();$('restart').onclick=()=>reset();$('action').onclick=action;$('next').onclick=()=>{if(state==='clear'){level++;makeBricks();ready();$('notice').textContent=level+'단계 도전! 공이 더 빨라졌어요.';}};
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space'].includes(e.code)){e.preventDefault();if(e.code==='ArrowLeft')keys.left=true;if(e.code==='ArrowRight')keys.right=true;if(e.code==='Space'&&!e.repeat){if(state==='intro')ready();else action();}}});window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft')keys.left=false;if(e.code==='ArrowRight')keys.right=false;});
function pauseAway(){keys.left=keys.right=false;if(state==='playing')action();}window.addEventListener('blur',pauseAway);document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseAway();});
function pointer(e){if(['playing','ready','intro'].includes(state)){let r=canvas.getBoundingClientRect();move((e.clientX-r.left)*W/r.width);}}canvas.addEventListener('pointermove',pointer);canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointer(e);});
function update(dt){if(['playing','ready','intro'].includes(state)&&keys.left!==keys.right)move(paddle.x+paddle.w/2+(keys.right?1:-1)*650*dt);if(state!=='playing')return;let steps=Math.ceil(speeds[level-1]*dt/4),d=dt/steps;for(let n=0;n<steps;n++){let ox=ball.x,oy=ball.y;ball.x+=ball.vx*d;ball.y+=ball.vy*d;if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx);}if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx);}if(ball.y<ball.r){ball.y=ball.r;ball.vy=Math.abs(ball.vy);}
if(ball.vy>0&&oy+ball.r<=paddle.y&&ball.y+ball.r>=paddle.y&&ball.x+ball.r>=paddle.x&&ball.x-ball.r<=paddle.x+paddle.w){let hit=Math.max(-1,Math.min(1,(ball.x-paddle.x-paddle.w/2)/(paddle.w/2))),a=hit*1.05,s=speeds[level-1];ball.vx=s*Math.sin(a);ball.vy=-s*Math.cos(a);ball.y=paddle.y-ball.r;}
for(let b of bricks){if(!b.alive)continue;let cx=Math.max(b.x,Math.min(ball.x,b.x+b.w)),cy=Math.max(b.y,Math.min(ball.y,b.y+b.h));if((ball.x-cx)**2+(ball.y-cy)**2<ball.r**2){b.alive=false;score+=10;if(oy+ball.r<=b.y||oy-ball.r>=b.y+b.h){ball.vy*=-1;ball.y=oy;}else{ball.vx*=-1;ball.x=ox;}for(let k=0;k<8;k++)particles.push({x:cx,y:cy,vx:(Math.random()-.5)*170,vy:(Math.random()-.5)*170,t:.5,color:b.color});hud();if(bricks.every(b=>!b.alive)){state=level===3?'won':'clear';screen(level===3?'모든 단계 완료!':level+'단계 성공!',level===3?'최종 점수 '+score+'점! 멋진 도전이었어요.':'다음 단계 버튼을 눌러 도전을 이어 가세요.');$('notice').textContent=level===3?'축하해요! 세 단계를 모두 깼어요.':'단계 완료!';return;}break;}}
if(ball.y-ball.r>H){life=Math.max(0,Math.min(5,life-1));if(life===0){state='over';screen('게임 끝','최종 점수 '+score+'점 · 다시 하기로 재도전하세요.');$('notice').textContent='다시 도전해 볼까요?';}else{ready();$('notice').textContent='생명 −1 · 남은 벽돌에 다시 도전하세요.';}return;}}}
function box(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function draw(dt){ctx.clearRect(0,0,W,H);ctx.fillStyle='#223049';for(let x=25;x<W;x+=30)for(let y=20;y<H;y+=30){ctx.beginPath();ctx.arc(x,y,1,0,Math.PI*2);ctx.fill();}for(let b of bricks)if(b.alive){box(b.x,b.y+3,b.w,b.h,6,'#0006');box(b.x,b.y,b.w,b.h,6,b.color);box(b.x+6,b.y+3,b.w-12,3,2,'#ffffff55');}if(state==='playing'){for(let p of particles){p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}particles=particles.filter(p=>p.t>0);}for(let p of particles){ctx.globalAlpha=Math.max(0,p.t*2);box(p.x,p.y,5,5,2,p.color);}ctx.globalAlpha=1;ctx.shadowColor='#88eed4';ctx.shadowBlur=14;box(paddle.x,paddle.y,paddle.w,paddle.h,8,'#88eed4');ctx.shadowColor='#fff';ctx.shadowBlur=16;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#e895a655';ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(0,H-4);ctx.lineTo(W,H-4);ctx.stroke();ctx.setLineDash([]);}
function frame(t){let dt=Math.min((t-last)/1000||0,0.035);last=t;update(dt);draw(dt);requestAnimationFrame(frame);}reset(true);requestAnimationFrame(frame);
</script></body></html>
