<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>빛을 찾아서 · 인상주의 퀴즈</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f6ed;color:#233d3b;font-family:'Malgun Gothic',sans-serif}main{max-width:960px;margin:auto;padding:28px 20px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}.eyebrow{font-size:17px;color:#476762;font-weight:bold}h1{font-size:clamp(30px,5vw,46px);margin:10px 0}h2{font-size:27px;line-height:1.5;margin:12px 0 24px}p{font-size:20px;line-height:1.7}.sun{width:88px;height:88px;flex-shrink:0;border-radius:50%;background:#f7c96b;box-shadow:14px 10px 0 #e9ecd6}.tabs{display:flex;gap:12px;margin:24px 0}button{font:700 20px 'Malgun Gothic',sans-serif;min-height:58px;border:2px solid #c5d6cc;border-radius:16px;padding:14px 22px;background:#fff;color:#25463f;cursor:pointer;touch-action:manipulation}button:hover:not(:disabled){background:#edf7ed;border-color:#49816f}button:focus-visible{outline:4px solid #477dc7;outline-offset:3px}button:disabled{cursor:default}.primary,.tabs button.active{background:#285f50;color:#fff;border-color:#285f50}.primary:hover:not(:disabled){background:#1b4d40}.stats{display:flex;justify-content:space-between;gap:12px;font-size:22px;font-weight:bold}.track{height:10px;background:#e0e6db;border-radius:10px;margin:16px 0 24px;overflow:hidden}.bar{height:100%;background:#559885;transition:width .3s}.panel{background:#fff;border:1px solid #dde5d8;border-radius:26px;padding:clamp(20px,4vw,38px);box-shadow:0 8px 30px #335a3910}.pill{display:inline-block;background:#edf2df;color:#536342;padding:8px 14px;border-radius:30px;font-size:16px;font-weight:bold}.options{display:grid;grid-template-columns:1fr 1fr;gap:14px}.option{text-align:left;display:flex;align-items:center;gap:14px;min-height:88px;line-height:1.5}.num{display:grid;place-items:center;min-width:36px;height:36px;border-radius:50%;background:#edf1e9}.correct{background:#e2f4e7!important;border-color:#34805a!important;color:#215537}.wrong{background:#fff0e9!important;border-color:#c27650!important;color:#85462b}.feedback{padding:20px;border-radius:16px;background:#fff3d8;margin-top:20px;font-size:20px;line-height:1.7}.feedback.good{background:#e7f4e9}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.muted{color:#59716b;font-size:17px;line-height:1.7}footer{margin:24px 0;font-size:16px;color:#5e726a}.note{padding:24px 0;border-bottom:1px solid #dce5d9}.note h3{font-size:22px;line-height:1.6;margin:8px 0}.note p{font-size:18px;margin:8px 0}.bigscore{font-size:64px;font-weight:bold;color:#285f50;margin:16px 0}.empty{text-align:center;padding:35px 0}[hidden]{display:none!important}@media(max-width:600px){.options{grid-template-columns:1fr}main{padding:18px 12px}.sun{width:56px;height:56px}.tabs button{padding:12px;font-size:18px}h2{font-size:24px}.stats{font-size:19px}}
@media print{header,.tabs,footer,.actions{display:none}.panel{box-shadow:none;border:none}.note{break-inside:avoid}body{background:#fff}}
</style></head><body><main><header><div><div class="eyebrow">중학교 2학년 · 미술 이론 연습</div><h1>빛을 찾아서</h1><div class="muted">색과 순간을 담은 인상주의, 퀴즈로 만나 볼까요?</div></div><div class="sun" aria-hidden="true"></div></header><nav class="tabs" aria-label="학습 메뉴"><button id="quizTab" class="active">퀴즈 풀기</button><button id="notesTab">오답노트 <span id="noteCount">0</span></button></nav><section id="quiz"></section><section id="notes" class="panel" hidden></section><footer id="storage">로그인·인터넷 없이 사용해요. 오답노트는 이 기기의 브라우저에 저장돼요.</footer></main><script>
'use strict';
const questions=[
{topic:'시대와 지역',q:'인상주의가 19세기 후반에 주로 시작된 나라는 어디일까요?',o:['프랑스','이탈리아','그리스','이집트'],a:0,h:'당시 파리는 새로운 미술과 도시 문화가 활발하게 펼쳐지던 곳이었어요.',e:'인상주의는 19세기 후반 프랑스를 중심으로 나타났어요. 화가들은 전통적인 표현 방식에서 벗어나 새로운 시각을 탐구했어요.'},
{topic:'빛과 색',q:'인상주의 화가들이 특히 관심을 가진 것은 무엇일까요?',o:['인물의 신분을 드러내는 상징','빛에 따라 달라지는 순간의 색','수학적으로 완벽한 인체 비례','상상 속 세계의 신비한 사건'],a:1,h:'같은 풍경도 아침과 저녁에 다르게 보이는 까닭을 생각해 보세요.',e:'인상주의 화가들은 빛과 대기의 변화에 따라 달라지는 색과 순간적인 인상을 표현하려 했어요.'},
{topic:'야외 제작',q:'인상주의 화가들이 야외에서 풍경을 그린 주된 이유는 무엇일까요?',o:['모든 사물의 크기를 재기 위해','옛 그림의 구도를 복사하기 위해','변화하는 자연의 빛을 관찰하기 위해','물체의 윤곽만 정확히 따기 위해'],a:2,h:'실내에서 기억만으로 그릴 때와, 햇빛 아래에서 직접 볼 때를 비교해 보세요.',e:'야외 제작은 시시각각 바뀌는 햇빛과 대기의 색을 직접 관찰하고 표현하는 데 도움이 되었어요.'},
{topic:'붓질',q:'인상주의 회화에서 흔히 볼 수 있는 붓질은 무엇일까요?',o:['윤곽만 남기고 내부를 비우는 붓질','표면 전체를 한 색으로 덮는 붓질','붓 자국을 모두 없애는 매끈한 붓질','짧고 눈에 드러나는 생동감 있는 붓질'],a:3,h:'빠르게 변하는 빛의 느낌을 담으려면 어떤 붓질이 도움이 될까요?',e:'짧고 눈에 드러나는 붓질은 빛과 색의 생동감을 표현하는 데 쓰였어요. 모든 인상주의 작품의 붓질이 똑같은 것은 아니에요.'},
{topic:'이름의 유래',q:'‘인상주의’라는 이름의 유래와 관련된 모네의 작품은 무엇일까요?',o:['〈별이 빛나는 밤〉','〈인상, 해돋이〉','〈모나리자〉','〈게르니카〉'],a:1,h:'작품 제목에는 눈앞의 장면에서 받는 느낌을 뜻하는 말이 들어 있어요.',e:'모네의 〈인상, 해돋이〉는 ‘인상주의’라는 이름의 유래와 관련된 작품이에요. 항구의 빛과 분위기를 담았어요.'},
{topic:'연작',q:'모네가 같은 대상을 시간과 날씨를 달리해 여러 번 그린 이유로 가장 알맞은 것은?',o:['모든 그림의 색을 같게 맞추려고','대상의 설계도를 완성하려고','빛에 따라 달라지는 모습을 탐구하려고','그림 속 사물을 하나씩 없애려고'],a:2,h:'대상의 형태가 그대로여도 해가 뜨거나 안개가 끼면 무엇이 달라질까요?',e:'모네는 건초더미나 루앙 대성당 등을 반복해서 그리며 시간·날씨에 따라 달라지는 빛과 색을 탐구했어요.'},
{topic:'그림의 소재',q:'인상주의 화가들이 즐겨 다룬 소재로 가장 알맞은 것은?',o:['산책과 뱃놀이 같은 일상과 여가','고대 영웅의 업적만을 담은 장면','왕의 권위를 알리는 의식만의 장면','종교 경전의 기적만을 담은 장면'],a:0,h:'당시 사람들이 공원, 강가, 카페에서 보내는 시간을 떠올려 보세요.',e:'인상주의 화가들은 자연 풍경뿐 아니라 산책·뱃놀이·카페 등 당시 사람들의 일상과 여가에도 관심을 가졌어요.'},
{topic:'화가와 소재',q:'무용수의 연습과 공연 장면을 자주 그린 인상주의 그룹의 화가는?',o:['클로드 모네','오귀스트 르누아르','카미유 피사로','에드가 드가'],a:3,h:'이 화가는 무대 위의 공연뿐 아니라 연습실에서 움직이는 인물도 관찰했어요.',e:'에드가 드가는 무용수들의 움직임과 자세를 자주 그렸어요. 인상주의 전시에 참여했지만 야외 풍경보다 실내 인물 장면을 많이 다뤘어요.'},
{topic:'그림자 표현',q:'인상주의의 색채 관찰 방식에 가까운 그림자 표현은 무엇일까요?',o:['모든 그림자를 똑같은 검정으로 칠한다','주변 빛과 색을 살펴 그림자의 색을 표현한다','그림자는 밝은 흰색으로만 칠한다','그림자를 지워 사물의 입체감을 없앤다'],a:1,h:'그늘에도 하늘빛이나 주변 물체의 색이 영향을 줄 수 있어요.',e:'인상주의 화가들은 그림자에서도 주변 빛과 색의 영향을 관찰했어요. 그림자를 무조건 검정 한 가지로 표현한 것은 아니에요.'},
{topic:'적용하기',q:'인상주의의 관심을 경험하기에 가장 알맞은 활동은 무엇일까요?',o:['같은 꽃을 같은 조명에서 윤곽선만 반복해 그리기','꽃의 실제 색과 관계없이 상징색만 정해 그리기','같은 꽃밭을 아침과 오후에 관찰해 색의 차이 그리기','꽃의 종류를 구분하는 설명문만 자세히 쓰기'],a:2,h:'시간이 바뀔 때 눈에 보이는 색이 어떻게 달라지는지 관찰하는 활동을 골라 보세요.',e:'같은 꽃밭을 다른 시간에 관찰하면 빛에 따른 색과 분위기의 차이를 발견할 수 있어요. 인상주의의 관심을 직접 경험하는 방법이에요.'}
];
const $=id=>document.getElementById(id),key='impression-notes-v1';let index=0,score=0,started=false,finished=false,selected=null,answered=false,review=false,order=questions.map((_,i)=>i),attempts={},notes={};
try{const raw=JSON.parse(localStorage.getItem(key)||'{}');for(const [k,v] of Object.entries(raw)){if(questions[k]&&Array.isArray(v.wrong))notes[k]={wrong:v.wrong.filter(x=>Number.isInteger(x)&&x>=0&&x<4&&x!==questions[k].a),mastered:!!v.mastered};}}catch{};
function save(){try{localStorage.setItem(key,JSON.stringify(notes));}catch{$('storage').textContent='이 브라우저에서는 저장이 제한돼요. 오답노트는 창을 닫기 전까지 이용할 수 있어요.';}$('noteCount').textContent=Object.keys(notes).length;}
function tab(which){$('quiz').hidden=which!=='quiz';$('notes').hidden=which!=='notes';$('quizTab').classList.toggle('active',which==='quiz');$('notesTab').classList.toggle('active',which==='notes');if(which==='notes')renderNotes();}
function begin(isReview=false){review=isReview;order=isReview?Object.keys(notes).map(Number):questions.map((_,i)=>i);if(!order.length)return;index=0;score=0;started=true;finished=false;attempts={};selected=null;answered=false;tab('quiz');render();}
function render(){const root=$('quiz');if(!started){root.innerHTML='<div class="panel"><span class="pill">인상주의 · 열 가지 질문</span><h2>그림 속 빛을 발견하는 시간</h2><p>문제를 읽고 정답을 골라 보세요.<br>틀렸다면 힌트를 읽고 한 번 더 생각해 봐요.</p><p class="muted">정답을 맞히면 문항당 10점! 다시 시도해도 점수를 받아요.<br>틀린 문제는 자동으로 오답노트에 남아요. 최고 점수는 100점이에요.</p><div class="actions"><button class="primary" onclick="begin()">퀴즈 시작하기</button></div></div>';return;}
if(finished){root.innerHTML=`<div class="panel"><span class="pill">${review?'오답 복습':'열 문제 도전'} 완료</span><h2>빛과 색을 한 걸음 더 이해했어요!</h2><div class="bigscore">${score}<span style="font-size:24px"> / ${order.length*10}점</span></div><p>이번에 처음 선택으로 맞힌 문제: ${order.filter(id=>!attempts[id]).length}개<br>힌트를 활용한 문제: ${Object.keys(attempts).length}개</p><p class="muted">점수는 힌트를 보고 다시 맞힌 문항도 포함한 학습 점수예요.</p><div class="actions"><button class="primary" onclick="tab('notes')">오답노트 보기</button><button onclick="begin()">전체 다시 풀기</button></div></div>`;return;}
const id=order[index],q=questions[id];root.innerHTML=`<div class="stats"><span>${review?'오답 복습':'문제'} ${index+1} / ${order.length}</span><span>${score}점</span></div><div class="track"><div class="bar" style="width:${index/order.length*100}%"></div></div><div class="panel"><span class="pill">${q.topic}</span><h2 tabindex="-1" id="question">${q.q}</h2><div class="options">${q.o.map((o,i)=>`<button class="option ${selected===i?(answered?'correct':'wrong'):''}" onclick="choose(${i})" ${answered?'disabled':''}><span class="num">${i+1}</span><span>${o}${selected===i?(answered?' ✓':' · 다시 생각해요'):''}</span></button>`).join('')}</div><div id="feedback" role="status" aria-live="polite" class="feedback ${answered?'good':''}" ${selected===null?'hidden':''}>${selected!==null?(answered?'<b>정답이에요! +10점</b><br>'+q.e:'<b>힌트를 보고 다시 골라 보세요.</b><br>'+q.h):''}</div><div class="actions">${answered?`<button class="primary" id="next" onclick="next()">${index===order.length-1?'결과 보기':'다음 문제'}</button>`:''}</div></div>`;}
function choose(i){if(answered||finished)return;const id=order[index],q=questions[id];selected=i;if(i===q.a){answered=true;score+=10;if(notes[id]){notes[id].mastered=true;save();}}else{attempts[id]=true;notes[id]??={wrong:[],mastered:false};if(!notes[id].wrong.includes(i))notes[id].wrong.push(i);notes[id].mastered=false;save();}render();}
function next(){if(!answered)return;index++;selected=null;answered=false;if(index>=order.length)finished=true;render();if(!finished)$('question').focus();}
function renderNotes(){const ids=Object.keys(notes).map(Number);$('notes').innerHTML=`<span class="pill">나의 배움 기록</span><h2>오답노트 · ${ids.length}문제</h2><p class="muted">틀렸던 선택과 핵심 개념을 확인해요. 다시 맞혀도 기록은 남아요.</p>${ids.length?`<div class="actions"><button class="primary" onclick="begin(true)">오답만 다시 풀기</button><button onclick="window.print()">오답노트 인쇄</button><button onclick="clearNotes()">노트 비우기</button></div>`:'<div class="empty"><p>아직 기록된 오답이 없어요.<br>퀴즈를 풀면 틀린 문제가 여기에 모여요.</p><button onclick="tab(\'quiz\')">퀴즈로 돌아가기</button></div>'}${ids.map(id=>{const q=questions[id],n=notes[id];return `<article class="note"><span class="pill">${n.mastered?'다시 맞혔어요':'복습해 보세요'}</span><h3>${id+1}. ${q.q}</h3><p>내가 골랐던 오답: ${n.wrong.map(i=>q.o[i]).join(' / ')}</p><p><b>정답: ${q.o[q.a]}</b></p><p>${q.e}</p><p class="muted">힌트: ${q.h}</p></article>`;}).join('')}`;}
function clearNotes(){if(confirm('저장된 오답노트를 모두 지울까요?')){notes={};save();renderNotes();}}
$('quizTab').onclick=()=>tab('quiz');$('notesTab').onclick=()=>tab('notes');save();render();
</script></body></html>
